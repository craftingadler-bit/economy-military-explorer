<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- HEAD START -->
<title>Economy &amp; Military Explorer</title>
<meta name="description" content="Do richer countries keep bigger armies? An interactive explorer of productivity, trade and armed forces in 194 countries, 1950–2014. Every number is recalculated live.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://craftingadler-bit.github.io/economy-military-explorer/">
<meta property="og:title" content="Do richer countries keep bigger armies? | Economy &amp; Military Explorer">
<meta property="og:description" content="Do richer countries keep bigger armies? An interactive explorer of productivity, trade and armed forces in 194 countries, 1950–2014. Every number is recalculated live.">
<meta property="og:image" content="https://craftingadler-bit.github.io/economy-military-explorer/og-image.png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1254">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<!-- HEAD END -->
</head>
<body>
<!-- BODY START -->
<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#overview">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">Economy, Trade &amp; Armed Forces <span class="brand-years">1950–2014</span></span>
    </a>
    <nav class="mainnav" id="mainnav" aria-label="Sections"></nav>
    <div class="topbar-tools">
      <button class="btn btn-accent" id="tour-start" type="button" title="Step through the prepared presentation (← / → or a presenter clicker)">Present</button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Light / dark">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 2.5a7.5 7.5 0 1 0 0 15z" fill="currentColor"/><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="app" class="app" tabindex="-1">
  <div class="boot">Loading the analysis data…</div>
</main>

<div class="tourbar" id="tourbar" hidden>
  <div class="tourbar-inner">
    <div class="tour-progress" id="tour-progress" aria-hidden="true"></div>
    <div class="tour-text">
      <div class="tour-kicker" id="tour-kicker"></div>
      <div class="tour-caption" id="tour-caption"></div>
    </div>
    <div class="tour-controls">
      <button class="btn" id="tour-prev" type="button" aria-label="Previous step">←</button>
      <span class="tour-count" id="tour-count"></span>
      <button class="btn btn-accent" id="tour-next" type="button" aria-label="Next step">→</button>
      <button class="btn btn-ghost" id="tour-end" type="button">End</button>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip" role="status" hidden></div>
<div class="loading" id="loading" hidden><div class="loading-card"><div class="spinner" aria-hidden="true"></div><div id="loading-text">Loading…</div></div></div>

<script src="data/meta.js"></script>
<script src="data/reference.js"></script>
<script src="js/stats.js"></script>
<script src="js/content.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<!-- BODY END -->
</body>
</html>
